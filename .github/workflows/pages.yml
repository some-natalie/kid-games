name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install Zola
        env:
          ZOLA_VERSION: 0.23.6
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "${RUNNER_TEMP}/zola.tar.gz"
          echo "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4  ${RUNNER_TEMP}/zola.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/zola.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Test word selection
        run: node --test tests/*.test.mjs
      - name: Check word-bank content guards
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Check site
        run: zola check
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5.0.0
      - name: Build preview
        if: github.event_name == 'pull_request'
        run: zola build
      - name: Build for Pages
        if: github.event_name != 'pull_request'
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: zola build --base-url "$BASE_URL"
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4.0.5
