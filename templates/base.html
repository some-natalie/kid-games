<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  <script src="{{ get_url(path='site-font.js', cachebust=true) }}" defer></script>
  <script src="{{ get_url(path='site-quiz.js', cachebust=true) }}" type="module"></script>
</head>
<body class="{% block body_class %}{% endblock body_class %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ config.base_url }}/"><span aria-hidden="true">🎈</span> {{ config.title }}</a>
    <span>Little games. Big smiles.</span>
  </header>
  <main id="main" tabindex="-1">
    {% block content %}{% endblock content %}
  </main>
  <footer>
    <div class="font-preference" hidden>
      <label><input id="opendyslexic-toggle" type="checkbox" aria-describedby="font-status"> Use OpenDyslexic font</label>
      <p id="font-status" role="status" aria-live="polite"></p>
    </div>
    <p>Made for curious minds.</p>
  </footer>
</body>
</html>
